<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | AutoAudit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef3f9;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #102b4e;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px 30px;
            border-radius: 10px;
            border: 1px solid #dce5ef;
            box-shadow: 0 5px 20px rgba(20, 50, 80, 0.08);
        }

        .logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid #2463eb;
            border-left-color: #cbd8e8;
            border-radius: 50%;
            color: #102b4e;
            font-size: 42px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 750;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #8492a6;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group-text {
            background: #f8fafc;
            border-color: #dce5ef;
            color: #102b4e;
            padding: 12px 15px;
        }

        .form-control {
            border-color: #dce5ef;
            padding: 12px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #2463eb;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #2463eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 650;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #174fc5;
            color: white;
        }

        .footer {
            text-align: center;
            color: #9aa6b6;
            font-size: 11px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h1>AutoAudit</h1>

        <p class="subtitle">Inicia sesión para continuar</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-user"></i>
                </span>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Usuario"
                    required
                    autofocus>
            </div>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Contraseña"
                    required>
            </div>

            <button type="submit" class="btn btn-login">
                Iniciar sesión
            </button>

        </form>

        <div class="footer">
            AutoAudit · Sistema de auditoría automatizada
        </div>

    </div>

</body>
</html>
